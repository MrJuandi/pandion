name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standard fuel dependency
        run: python -m pip install -r requirements-standard.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
